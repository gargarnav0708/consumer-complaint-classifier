# One stable address in front of all API pods; Kubernetes load-balances across them.
apiVersion: v1
kind: Service
metadata:
  name: complaint-api
spec:
  type: NodePort
  selector:
    app: complaint-api
  ports:
    - port: 80          # port inside the cluster
      targetPort: 8000  # port the container listens on
      nodePort: 30080   # port exposed on the Minikube node
